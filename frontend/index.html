<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Recipe Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="main-header">
        <h1>Personal Recipe Archive</h1>
        <blockquote id="motivational-quote">
            "This is a where you will see a motivational quote." — Unknown
        </blockquote>
    </header>

    <main>
        <div id="connection-status">Connecting...</div>
        
        <section id="search-section">
            <input 
                type="text" 
                id="search-bar" 
                placeholder="search..."
            >
        </section>

        <section id="filter-section">
            <button class="filter-chip active" data-category="all">all</button>
            <button class="filter-chip" data-category="breakfast">breakfast</button>
            <button class="filter-chip" data-category="dessert">dessert</button>
            <button class="filter-chip" data-category="dinner">dinner</button>
            <button class="filter-chip" data-category="main_course">main course</button>
            <button class="filter-chip" data-category="side">side</button>
        </section>

        <!-- Recipe cards are now rendered dynamically by app.js from the
             backend API response — nothing hardcoded here anymore. -->
        <section id="recipe-container"></section>
    </main>

    <footer id="main-footer">
        <button id="edit-mode-btn">Edit Recipes</button>
    </footer>

    <script src="app.js"></script>
</body>
</html>
