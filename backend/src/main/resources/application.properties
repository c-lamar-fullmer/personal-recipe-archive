# --- Database connection ---
# 1. Create the database first (in psql or a GUI like pgAdmin):
#      CREATE DATABASE recipe_archive;
# 2. Replace YOUR_DB_USERNAME / YOUR_DB_PASSWORD below with your local
#    PostgreSQL credentials.
spring.datasource.url=jdbc:postgresql://localhost:5432/recipe_archive
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# ddl-auto=update makes Hibernate create/update tables automatically from
# your @Entity classes on startup, based on the model/ classes. Convenient
# while learning; for a real project you'd eventually manage schema changes
# more carefully (e.g. with Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Server ---
server.port=8080
